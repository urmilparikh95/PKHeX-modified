name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test enhance
        run: dotnet test src/PKHeX.Facade.Tests --filter "FullyQualifiedName~PokemonEnhanceTests" --verbosity normal

  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Engine SDK dependencies
        working-directory: src/PKHeX.Everywhere.Engine.Sdk
        run: npm ci

      - name: Build the Engine Vite plugin
        working-directory: src/PKHeX.Everywhere.Engine.Sdk/packages/engine
        run: npx vite build

      - name: Publish the engine
        working-directory: src/PKHeX.Web.React
        run: |
          npm ci
          dotnet publish ../PKHeX.Everywhere.Engine.Host -c Release

      - name: Build the web app
        working-directory: src/PKHeX.Web.React
        run: |
          npx tsc --noEmit
          npx vite build
          sed -i "s#location.replace('/')#location.replace('${BASE_PATH}')#" dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/PKHeX.Web.React/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
